# Rules the code relies on. Call out any that a change touches.

[[invariants]]
id = "session-identity"
summary = "A session is identified by system prompt, tool set, model and effort."
code = ["src/providers/claude/conversation.ts", "src/providers/claude/provider.ts"]
docs = ["README.md#how-conversations-map-onto-claude-code"]

[[invariants]]
id = "tool-call-id"
summary = "Tool results match by Claude's own toolu_ id, so the same process continues."
code = ["src/providers/claude/toolBridge.ts", "src/providers/claude/session.ts"]
docs = ["README.md#how-conversations-map-onto-claude-code"]

[[invariants]]
id = "claude-as-model"
summary = "Claude Code's built-in tools stay off; only harness tools are exposed."
code = ["src/providers/claude/session.ts", "src/providers/claude/provider.ts"]
docs = ["README.md#features"]

[[invariants]]
id = "subscription-billing"
summary = "ANTHROPIC_API_KEY is stripped so usage goes to the subscription."
code = ["src/providers/claude/session.ts", "src/providers/claude/provider.ts", "src/config.ts"]
docs = ["README.md#config"]

[[invariants]]
id = "capture-redaction"
summary = "Captured requests redact secrets."
code = ["src/capture/recorder.ts"]
docs = ["README.md#capture-and-test-mode"]

[[invariants]]
id = "api-key-auth"
summary = "When server.api_key is set, every request must carry it."
code = ["src/server.ts", "src/config.ts"]
docs = ["README.md#config"]

[[invariants]]
id = "claude-isolation"
summary = "Claude runs with setting_sources empty, so CLAUDE.md, hooks and plugins stay out."
code = ["src/providers/claude/session.ts", "src/providers/claude/provider.ts", "src/config.ts"]
docs = ["README.md#config"]

[[invariants]]
id = "thinking-not-replayed"
summary = "Seeded history never replays thinking, since signatures can't be forged."
code = ["src/providers/claude/seed.ts"]
docs = ["README.md#how-conversations-map-onto-claude-code"]
