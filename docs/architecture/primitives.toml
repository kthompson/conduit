# Rules the code relies on. Call out any that a change touches.

[[invariants]]
id = "session-identity"
summary = "A session is identified by system prompt, tool set, model and effort."
code = [
  "src/providers/conversation.ts",
  "src/providers/conversationProvider.ts",
  "src/providers/matching.ts",
]
docs = ["README.md#how-conversations-map-onto-live-sessions"]

[[invariants]]
id = "tool-call-id"
summary = "Tool results match by the agent's own call id, so the same process continues."
code = [
  "src/providers/claude/toolBridge.ts",
  "src/providers/claude/session.ts",
  "src/providers/codex/session.ts",
  "src/providers/pendingTools.ts",
]
docs = ["README.md#how-conversations-map-onto-live-sessions"]

[[invariants]]
id = "claude-as-model"
summary = "Claude Code's built-in tools stay off; only harness tools are exposed."
code = ["src/providers/claude/session.ts", "src/providers/claude/options.ts"]
docs = ["README.md#features"]

[[invariants]]
id = "subscription-billing"
summary = "ANTHROPIC_API_KEY and OPENAI_API_KEY are stripped so usage goes to the subscription."
code = ["src/providers/claude/options.ts", "src/providers/codex/appServer.ts", "src/config.ts"]
docs = ["README.md#config"]

[[invariants]]
id = "capture-redaction"
summary = "Captured requests redact secrets."
code = ["src/capture/recorder.ts"]
docs = ["README.md#capture-and-test-mode"]

[[invariants]]
id = "api-key-auth"
summary = "When server.api_key is set, every request must carry it."
code = ["src/server.ts", "src/config.ts"]
docs = ["README.md#config"]

[[invariants]]
id = "claude-isolation"
summary = "Claude runs with setting_sources empty, so CLAUDE.md, hooks and plugins stay out."
code = ["src/providers/claude/options.ts", "src/config.ts"]
docs = ["README.md#config"]

[[invariants]]
id = "thinking-not-replayed"
summary = "Seeded history never replays thinking, since signatures can't be forged."
code = ["src/providers/claude/seed.ts"]
docs = ["README.md#how-conversations-map-onto-live-sessions"]

[[invariants]]
id = "codex-as-model"
summary = "Codex gets no environment, a read-only sandbox and declined approvals; only harness tools act."
code = ["src/providers/codex/session.ts"]
docs = ["README.md#codex"]

[[invariants]]
id = "codex-isolation"
summary = "Codex runs on a scratch CODEX_HOME, so its config, MCP servers and plugins stay out."
code = ["src/providers/codex/home.ts", "src/providers/codex/appServer.ts"]
docs = ["README.md#codex"]

[[invariants]]
id = "model-ownership"
summary = "A model id is served by the provider that owns it; unclaimed ids go to default_provider."
code = ["src/server.ts", "src/providers/types.ts"]
docs = ["README.md#models-and-effort"]

[[invariants]]
id = "login-type-isolation"
summary = "Failover only moves between logins of the same provider type."
code = ["src/providers/registry.ts", "src/providers/conversationProvider.ts"]
docs = ["README.md#providers-and-the-web-ui"]
