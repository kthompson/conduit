# conduit's system primitives. The visual-recap skill classifies a diff against this map.
# `code` entries are file paths or directory prefixes (end with "/"). Longest match wins.
# Keep summaries to one short line; put detail in README.md.

version = 1

[[groups]]
id = "surface"
name = "Client surface"

[[groups]]
id = "providers"
name = "Providers"

[[groups]]
id = "claude"
name = "Claude provider"

[[groups]]
id = "tooling"
name = "Tooling"

[[primitives]]
id = "http-server"
name = "HTTP server"
group = "surface"
summary = "Routing, bearer auth and model routing for /v1 endpoints."
code = ["src/server.ts"]
docs = ["README.md#using-it-from-github-copilot"]

[[primitives]]
id = "openai-wire"
name = "OpenAI wire format"
group = "surface"
summary = "Chat Completions types plus SSE and JSON output."
